name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v2

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Build and push Docker image to Container Registry
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/homeschool-app .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy homeschool-app \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/homeschool-app \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated
